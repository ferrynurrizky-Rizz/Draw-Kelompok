<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Draw — Year End 2026</title>
<style>
:root {
  --bg:#02030a;
  --panel:rgba(10,13,25,.86);
  --panel2:rgba(15,19,35,.94);
  --line:rgba(255,255,255,.075);
  --text:#f7f8ff;
  --muted:#a7aec4;
  --gold:#d9a84e;
  --gold2:#ffe9a8;
  --accent:#756cff;
  --green:#58e0a3;
  --danger:#ff7b8b;
  --shadow:0 30px 100px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%, rgba(139,124,255,.18), transparent 38%),
    radial-gradient(circle at 10% 30%, rgba(245,199,106,.08), transparent 28%),
    linear-gradient(180deg,#080a13 0%,#060811 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent 90%);
}
button{font:inherit}
.app{width:min(1500px,100%);margin:auto;padding:26px clamp(16px,3vw,42px) 50px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
.brand small{display:block;color:var(--gold);font-weight:800;letter-spacing:.28em;font-size:11px}
.brand h1{margin:4px 0 0;font-size:clamp(24px,3vw,38px);letter-spacing:.03em}
.top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));color:var(--text);border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.09)}
.btn.primary{border-color:rgba(245,199,106,.4);background:linear-gradient(135deg,#a8792d 0%,#e0b75d 45%,#fff0b0 100%);color:#17120a;box-shadow:0 10px 30px rgba(245,199,106,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.7fr);gap:18px}
.stage,.side{border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,rgba(42,35,72,.24),transparent 38%),linear-gradient(145deg,rgba(13,16,30,.96),rgba(4,6,13,.98));box-shadow:var(--shadow);border-radius:24px}
.stage{min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;border:1px solid rgba(245,199,106,.10);box-shadow:0 0 120px rgba(139,124,255,.12) inset;top:50%;left:50%;transform:translate(-50%,-50%)}
.stage::after{content:"";position:absolute;width:430px;height:430px;border-radius:50%;border:1px dashed rgba(245,199,106,.09);top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 24s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.stage>*{position:relative;z-index:2}
.kicker{color:var(--muted);font-size:12px;letter-spacing:.24em;font-weight:800}
.status{height:32px;margin-top:10px;color:var(--gold);font-size:14px;font-weight:800;letter-spacing:.08em}
.name-wrap{width:min(900px,100%);min-height:150px;display:flex;align-items:center;justify-content:center;padding:10px 20px}
.name{font-size:clamp(32px,5vw,72px);line-height:1.04;font-weight:900;letter-spacing:-.03em;max-width:100%;overflow-wrap:anywhere;text-wrap:balance}
.rolling{animation:roll .08s linear infinite alternate}
@keyframes roll{from{transform:translateY(-2px);opacity:.55}to{transform:translateY(2px);opacity:1}}
.reveal{animation:reveal .55s cubic-bezier(.2,.9,.2,1)}
@keyframes reveal{0%{transform:scale(.82);opacity:0;filter:blur(8px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
.group-reveal{font-size:clamp(42px,7vw,92px);line-height:1;font-weight:1000;color:var(--gold2);text-shadow:0 0 40px rgba(245,199,106,.28);min-height:100px;display:flex;align-items:center}
.meta{min-height:26px;color:var(--muted);font-size:13px}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.draw-btn{min-width:230px;padding:16px 24px;border-radius:15px;border:1px solid rgba(245,199,106,.5);background:linear-gradient(135deg,#9d7028 0%,#d9aa4f 42%,#fff0ad 100%);color:#181208;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 16px 42px rgba(245,199,106,.16)}
.draw-btn:disabled{opacity:.5;cursor:not-allowed}
.side{padding:22px}
.side-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.side-title h2{margin:0;font-size:18px}
.side-title span{color:var(--muted);font-size:12px}
.progress{height:9px;border-radius:99px;background:#0b0e19;overflow:hidden;border:1px solid var(--line);margin-bottom:18px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6258e8,var(--gold),#ffe8a1);transition:.35s}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{padding:12px 8px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border-radius:13px;text-align:center}
.stat b{display:block;font-size:25px}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.group-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gmini{padding:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;min-height:74px}
.gmini .head{display:flex;justify-content:space-between;gap:5px;font-size:12px;font-weight:800}
.gmini .count{color:var(--gold)}
.gmini .bar{height:5px;background:#0b0e19;border-radius:99px;margin-top:10px;overflow:hidden}
.gmini .bar i{display:block;height:100%;width:0;background:var(--gold);transition:.3s}
.results{margin-top:18px}
.results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.results-head h2{margin:0;font-size:20px}
.results-head span{color:var(--muted);font-size:12px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,20,36,.92),rgba(8,10,20,.92));border-radius:18px;padding:15px;min-height:190px}
.card:nth-child(n+5){grid-column:span 1}
.card-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.card-head strong{font-size:14px}
.badge{color:var(--gold);font-size:11px;font-weight:800}
.people{display:flex;flex-direction:column;gap:5px}
.person{font-size:12px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.045);color:#dfe3ef;overflow-wrap:anywhere}
.person.new{animation:personIn .45s ease}
@keyframes personIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.done .stage{border-color:rgba(94,230,168,.28)}
.done .group-reveal{color:var(--green);text-shadow:0 0 40px rgba(94,230,168,.2)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;width:8px;height:14px;top:-20px;animation:fall 2.6s linear forwards;opacity:.9}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}
.hint{margin-top:14px;color:#cbd1df;font-size:12px;min-height:18px}
.footer-note{text-align:center;color:#707991;font-size:11px;margin-top:22px}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.stage{min-height:560px}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.app{padding:16px 10px 35px}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%;justify-content:flex-start}.stage{min-height:530px;padding:24px 12px;border-radius:18px}.stage::before{width:360px;height:360px}.stage::after{width:290px;height:290px}.side{padding:16px}.board{grid-template-columns:1fr}.name-wrap{min-height:125px;padding:8px}.group-mini{grid-template-columns:1fr 1fr}.btn,.draw-btn{width:100%}.controls{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== MOBILE RESPONSIVE ===== */

@media (max-width: 620px){

  /* Page */
  .app{
    width:100%;
    max-width:100%;
    padding:12px 10px 28px;
    box-sizing:border-box;
  }

  /* Header */
  .topbar{
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    margin-bottom:14px;
  }

  .brand{
    min-width:0;
  }

  .brand h1{
    font-size:22px;
    line-height:1.05;
  }

  .kicker{
    font-size:9px;
    letter-spacing:.14em;
  }

  /* Buttons */
  .top-actions{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
  }

  .top-actions .btn{
    width:100%;
    min-width:0;
    padding:10px 6px;
    font-size:10px;
    white-space:nowrap;
  }

  /* Hero */
  .hero{
    grid-template-columns:1fr;
    gap:12px;
    margin-bottom:12px;
  }

  /* Main draw area */
  .stage{
    min-height:360px;
    padding:20px 14px;
    box-sizing:border-box;
  }

  .stage .name{
    font-size:clamp(28px,8vw,44px);
    line-height:1.05;
    max-width:100%;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  .group-reveal{
    max-width:100%;
    overflow-wrap:anywhere;
  }

  .hint{
    font-size:11px;
    line-height:1.45;
    max-width:100%;
  }

  /* Draw button */
  #drawBtn{
    width:100%;
    min-height:50px;
    margin-top:12px;
  }

  /* Live progress */
  .side{
    width:100%;
    box-sizing:border-box;
    padding:14px;
  }

  /* Results */
  .results{
    margin-top:12px;
    gap:10px;
  }

  /* Group Board */
  .board{
    grid-template-columns:1fr !important;
    gap:10px;
  }

  .card{
    min-width:0;
    padding:12px;
  }

  .card-head{
    gap:8px;
  }

  .card-head strong{
    font-size:12px;
  }

  .badge{
    font-size:9px;
    white-space:nowrap;
  }

  .people{
    grid-template-columns:1fr;
    gap:5px;
  }

  .person{
    min-width:0;
    font-size:11px;
    line-height:1.3;
    padding:7px 8px;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  /* Leader */
  .leader{
    padding:9px 10px;
  }

  .leader span{
    font-size:8px;
  }

  .leader strong{
    font-size:12px;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  /* Footer */
  .footer-note{
    font-size:9px;
    line-height:1.4;
    text-align:center;
  }
}


/* ===== VERY SMALL PHONES ===== */

@media (max-width: 390px){

  .app{
    padding-left:8px;
    padding-right:8px;
  }

  .brand h1{
    font-size:19px;
  }

  .top-actions{
    gap:5px;
  }

  .top-actions .btn{
    font-size:9px;
    padding:9px 4px;
  }

  .stage{
    min-height:330px;
    padding:16px 11px;
  }

  .stage .name{
    font-size:28px;
  }

  .card{
    padding:10px;
  }

  .card-head strong{
    font-size:11px;
  }

  .badge{
    font-size:8px;
  }
}

/* PREMIUM VISUAL LAYER — draw logic intentionally untouched */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 50% 42%,rgba(117,108,255,.065),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(217,168,78,.045),transparent 24%);
}
.app{z-index:1}
.stage,.side,.card{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.stage{box-shadow:0 35px 120px rgba(0,0,0,.68),0 0 0 1px rgba(255,255,255,.025) inset}
.stage::before{box-shadow:0 0 160px rgba(117,108,255,.13) inset,0 0 90px rgba(217,168,78,.035)}
.brand h1{background:linear-gradient(90deg,#fff,#ffe6a1);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{color:#8f97ad}
.name{text-shadow:0 8px 40px rgba(0,0,0,.45)}
.group-reveal{filter:drop-shadow(0 0 22px rgba(217,168,78,.12))}
.card{box-shadow:0 16px 45px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.025)}
.gmini{box-shadow:inset 0 1px rgba(255,255,255,.025)}
.person{border:1px solid rgba(255,255,255,.035)}



/* FULLSCREEN PRESENTATION MODE — layout only, draw logic untouched */
:fullscreen body,
html:fullscreen body{overflow:hidden}
html:fullscreen .app{
  width:100%;
  height:100vh;
  max-width:none;
  padding:14px 24px 12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
html:fullscreen .topbar{margin-bottom:10px;min-height:48px}
html:fullscreen .brand small{font-size:9px;letter-spacing:.24em}
html:fullscreen .brand h1{font-size:28px;margin-top:2px}
html:fullscreen .btn{padding:8px 12px;border-radius:10px;font-size:12px}
html:fullscreen .hero{
  flex:1 1 auto;
  min-height:0;
  grid-template-columns:minmax(0,2.05fr) minmax(300px,.78fr);
  gap:12px;
}
html:fullscreen .stage,
html:fullscreen .side{min-height:0;height:100%;border-radius:18px}
html:fullscreen .stage{padding:18px 24px}
html:fullscreen .stage::before{width:min(54vh,520px);height:min(54vh,520px)}
html:fullscreen .stage::after{width:min(42vh,410px);height:min(42vh,410px)}
html:fullscreen .kicker{font-size:10px}
html:fullscreen .status{height:24px;margin-top:5px;font-size:12px}
html:fullscreen .name-wrap{min-height:0;flex:0 1 auto;width:min(900px,100%);padding:4px 12px}
html:fullscreen .name{font-size:clamp(38px,5.1vw,76px);line-height:.98}
html:fullscreen .group-reveal{font-size:clamp(40px,5.8vw,82px);min-height:64px}
html:fullscreen .meta{font-size:11px;min-height:20px}
html:fullscreen .hint{margin-top:7px;font-size:11px;min-height:16px}
html:fullscreen .controls{margin-top:12px}
html:fullscreen .draw-btn{min-width:220px;padding:13px 20px;font-size:15px}
html:fullscreen .side{padding:16px}
html:fullscreen .side-title{margin-bottom:9px}
html:fullscreen .side-title h2{font-size:15px}
html:fullscreen .side-title span{font-size:10px}
html:fullscreen .progress{height:7px;margin-bottom:10px}
html:fullscreen .stat-grid{gap:6px;margin-bottom:10px}
html:fullscreen .stat{padding:8px 5px;border-radius:10px}
html:fullscreen .stat b{font-size:21px}
html:fullscreen .stat span{font-size:8px}
html:fullscreen .group-mini{gap:6px}
html:fullscreen .gmini{padding:8px;min-height:54px;border-radius:9px}
html:fullscreen .gmini .head{font-size:10px}
html:fullscreen .gmini .bar{height:4px;margin-top:7px}
html:fullscreen .results{margin-top:10px;flex:0 0 25vh;min-height:0;display:flex;flex-direction:column}
html:fullscreen .results-head{margin-bottom:7px}
html:fullscreen .results-head h2{font-size:16px}
html:fullscreen .results-head span{font-size:10px}
html:fullscreen .board{flex:1;min-height:0;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
html:fullscreen .card{min-height:0;height:100%;padding:9px;border-radius:12px;overflow:hidden}
html:fullscreen .card-head{padding-bottom:6px;margin-bottom:6px}
html:fullscreen .card-head strong{font-size:10px}
html:fullscreen .badge{font-size:8px}
html:fullscreen .people{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:3px}
html:fullscreen .person{font-size:8px;line-height:1.12;padding:4px 4px;border-radius:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
html:fullscreen .footer-note{display:none}

/* Wide but short displays: keep the presentation on one screen */
@media (min-width:1051px) and (max-height:800px){
  .app{padding-top:14px;padding-bottom:18px}
  .topbar{margin-bottom:10px}
  .brand h1{font-size:30px}
  .hero{gap:12px}
  .stage{min-height:500px;padding:24px}
  .side{padding:16px}
  .results{margin-top:10px}
  .card{min-height:160px;padding:11px}
  .person{font-size:10px;padding:5px 6px}
}

@media (max-width:1100px){
  html:fullscreen .board{grid-template-columns:repeat(4,1fr)}
html:fullscreen .results{flex-basis:30vh}
}

/* ===== LEADER / KETUA KELOMPOK ===== */

.leader {
  margin: 10px 0 8px;
  padding: 10px 12px;
  border: 1px solid rgba(245, 199, 106, .38);
  border-radius: 10px;
  background:
    linear-gradient(
      135deg,
      rgba(245, 199, 106, .12),
      rgba(139, 124, 255, .08)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 8px 24px rgba(0,0,0,.18);
}

.leader span {
  display: block;
  margin-bottom: 4px;
  color: var(--gold);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.leader strong {
  display: block;
  color: var(--gold2);
  font-size: 13px;
  line-height: 1.25;
  font-weight: 900;
  letter-spacing: .02em;
  overflow-wrap: anywhere;
}

/* ===== MOBILE WIDTH FIX ===== */

@media (max-width: 620px){

  html,
  body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    overflow-x:hidden;
  }

  .topbar,
  .hero,
  .stage,
  .side,
  .results,
  .board,
  .card{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
  }

  /* Area undian */
  .stage{
    overflow:hidden;
  }

  /* Semua teks panjang jangan memaksa layar melebar */
  .stage .name,
  .stage .group-reveal,
  .stage .meta,
  .stage .hint{
    max-width:100%;
    min-width:0;
    overflow-wrap:anywhere;
    word-break:break-word;
  }

  /* Tombol undian */
  #drawBtn{
    width:100%;
    max-width:100%;
    box-sizing:border-box;
  }

  /* Progress */
  .side{
    overflow:hidden;
  }

  /* Group Board */
  .board{
    grid-template-columns:1fr !important;
    overflow:hidden;
  }

  .card{
    overflow:hidden;
  }

  .person,
  .leader,
  .leader strong{
    min-width:0;
    max-width:100%;
    overflow-wrap:anywhere;
    word-break:break-word;
  }
}

/* ===== FINAL MOBILE GROUP BOARD ===== */

@media (max-width: 620px){

  .results .board,
  .board{
    display:grid !important;
    grid-template-columns:1fr !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    gap:10px !important;
  }

  .results .board .card,
  .board .card{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    box-sizing:border-box !important;
  }

}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <small>YEAR END CELEBRATION • 2026</small>
      <h1>GROUP DRAW KGB 2026</h1>
    </div>
    <div class="top-actions">
  <button class="btn" id="fullBtn">⛶ Fullscreen</button>
  <button class="btn" id="saveBtn" disabled>💾 Simpan Hasil</button>
  <button class="btn" id="resetBtn">↻ Reset</button>
</div>
  </div>

  <section class="hero">
    <div class="stage" id="stage">
      <div class="kicker">THE NEXT PARTICIPANT IS</div>
      <div class="status" id="status">READY</div>
      <div class="name-wrap"><div class="name" id="name">SIAP UNTUK DIUNDI</div></div>
      <div class="group-reveal" id="group">—</div>
      <div class="meta" id="meta">• 68 peserta • 7 kelompok •</div>
      <div class="hint" id="hint">Tekan tombol di bawah untuk memulai undian.</div>
      <div class="controls">
        <button class="draw-btn" id="drawBtn">🎲 MULAI UNDIAN</button>
      </div>
    </div>

    <aside class="side">
      <div class="side-title">
        <h2>LIVE PROGRESS</h2>
        <span id="progressText">0 / 68</span>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="stat-grid">
        <div class="stat"><b id="remaining">68</b><span>Belum</span></div>
        <div class="stat"><b id="drawn">0</b><span>Sudah</span></div>
        <div class="stat"><b>7</b><span>Group</span></div>
      </div>
      <div class="group-mini" id="groupMini"></div>
    </aside>
  </section>

  <section class="results">
    <div class="results-head">
      <h2>GROUP BOARD</h2>
      <span>Hasil muncul undian</span>
    </div>
    <div class="board" id="board"></div>
  </section>

  <div class="footer-note">Data peserta • 68 peserta • Group 01–07</div>
</div>
<div class="confetti" id="confetti"></div>

<script>
const participants = [{"id":1,"name":"NEVYRA AYUNI BIKHAIRI"},{"id":2,"name":"GEEBYLLA RAGGY"},{"id":3,"name":"ARIEF AFFANDI"},{"id":4,"name":"ERICK SUSANTO"},{"id":5,"name":"FREDDY FRANZ"},{"id":6,"name":"KENNY MANUEL"},{"id":7,"name":"FLORENCIA WIDYASTRI"},{"id":8,"name":"ARISTA KRESNAJATI SURWIYANTA"},{"id":9,"name":"HESTI PUTRI KEN RISTRI"},{"id":10,"name":"REBEKA SAPUTRI"},{"id":11,"name":"AHMAD FERRY NUR RIZKI"},{"id":12,"name":"ANGGIT CAHYO PERMONO"},{"id":13,"name":"HANA SUKMA ANDERA"},{"id":14,"name":"KRISNA SETIAWAN"},{"id":15,"name":"LUSI WAHYUNI"},{"id":16,"name":"MANDRA BHAWAWIGUNA"},{"id":17,"name":"MIA FEBRIYANI"},{"id":18,"name":"BRIANTO WIJAYA"},{"id":19,"name":"SHAFIRNA UTAMI"},{"id":39,"name":"OCKY DWI ADITYA"},{"id":40,"name":"MUALINADYA PARAMITA"},{"id":41,"name":"IRMA YUDHA ARIANDINI"},{"id":42,"name":"RIDWAH BAIHAKI ANANDAR"},{"id":43,"name":"ANNISA AVRILIYANTI"},{"id":44,"name":"MUHAMMAD GHOZI AL FATIH"},{"id":45,"name":"ANISA FAUZIAH (Adm TWC)"},{"id":46,"name":"SONYA MAVI OLA"},{"id":21,"name":"MUHAMMAD SUDI ANGGORO SAPUTRO"},{"id":23,"name":"SUHERMAN"},{"id":24,"name":"MULYADI"},{"id":25,"name":"ARI MAULANA"},{"id":26,"name":"ABDUL AZIS"},{"id":20,"name":"WIDI WILLIAM"},{"id":22,"name":"DEDEH KURNIASIH"},{"id":27,"name":"BELLA PRAMESWARI PUTRI DJAELANI"},{"id":33,"name":"MOH NASRULLAH ZAKARIA"},{"id":34,"name":"GATOT SUPRIYADI"},{"id":35,"name":"HASTO CAHYO PRASETYO"},{"id":36,"name":"RESSA RIZKY RAMDHANI"},{"id":37,"name":"MUHAMMAD MAHFUD"},{"id":38,"name":"MISTIKA OKTAVIANI"},{"id":28,"name":"TAZKIA NADIA"},{"id":29,"name":"MUHAMMAD RIDHWAN RIADY"},{"id":30,"name":"PUTERA SEMITOA DASALAM BARDHANY"},{"id":31,"name":"ALIFIA BAHAR"},{"id":32,"name":"JESSICA ALVINA MULIAWAN"},{"id":47,"name":"RICHY DANIEL PANGARIBUAN"},{"id":48,"name":"SIGIT WAHYUDIYANTO"},{"id":49,"name":"WILDAN FAHMI"},{"id":50,"name":"HANS LEONARDO"},{"id":51,"name":"PANDU RADIAN RAFIUDIN"},{"id":52,"name":"FAJRI ZULKARNAINI"},{"id":53,"name":"VINKA ZAIN"},{"id":54,"name":"ANGGITA MURDIANINGSIH"},{"id":55,"name":"YENI CHAERUNISAH"},{"id":56,"name":"ALVIRA SAFITRI"},{"id":57,"name":"REYNOVASI"},{"id":58,"name":"EKO PRASTIYO"},{"id":59,"name":"NUR USWATUN HASANAH"},{"id":60,"name":"KEZIA ROSANA"},{"id":61,"name":"DITA WULANDARI"},{"id":62,"name":"RAYHAN SHUHADA"},{"id":63,"name":"LUSIYANTI"},{"id":64,"name":"ADE AYU SARI"},{"id":65,"name":"BEBY REGILYA SAFITRI"},{"id":66,"name":"ANTONIA DEVANI CHRISTIANA ANGELI"},{"id":67,"name":"ANNA PUSPITASARI"},{"id":68,"name":"SAFIRA NURVIANI"}];
const GROUPS = 7;
const TOTAL = participants.length;

const $ = id => document.getElementById(id);
let available = [];
let assigned = [];
let counts = Array(GROUPS).fill(0);
let leaders = Array(GROUPS).fill(null);
let busy = false;

function targetSize(group) {
  const base = Math.floor(TOTAL / GROUPS);
  const extra = TOTAL % GROUPS;
  return base + (group <= extra ? 1 : 0);
}

function chooseLeaders() {
  for (let g = 1; g <= GROUPS; g++) {
    const members = assigned.filter(x => x.group === g);

    if (members.length) {
      leaders[g - 1] =
        members[Math.floor(Math.random() * members.length)];
    }
  }
}

function reset() {
  available = [...participants];
  assigned = [];
  counts = Array(GROUPS).fill(0);
  leaders = Array(GROUPS).fill(null);
  busy = false;
  document.body.classList.remove("done");
  $("name").textContent = "SIAP UNTUK DIUNDI";
  $("group").textContent = "—";
  $("status").textContent = "READY";
  $("meta").textContent = `${TOTAL} peserta • 7 kelompok • ;
  $("hint").textContent = "Tekan tombol di bawah untuk memulai undian.";
  render();
}

function pickGroup() {
  const open = [];
  for (let g = 1; g <= GROUPS; g++) {
    if (counts[g - 1] < targetSize(g)) open.push(g);
  }
  return open[Math.floor(Math.random() * open.length)];
}

function render() {
  $("remaining").textContent = available.length;
  $("drawn").textContent = assigned.length;
  $("progressText").textContent = `${assigned.length} / ${TOTAL}`;
  $("progressBar").style.width = `${assigned.length / TOTAL * 100}%`;
  $("drawBtn").disabled = busy || available.length === 0;
  $("drawBtn").textContent = available.length ? "🎲 MULAI UNDIAN" : "✓ SEMUA PESERTA SELESAI";

  const mini = $("groupMini");
  mini.innerHTML = "";
  for (let g = 1; g <= GROUPS; g++) {
    const current = counts[g - 1], target = targetSize(g);
    const el = document.createElement("div");
    el.className = "gmini";
    el.innerHTML = `
      <div class="head"><span>GROUP ${String(g).padStart(2,"0")}</span><span class="count">${current}/${target}</span></div>
      <div class="bar"><i style="width:${current/target*100}%"></i></div>`;
    mini.appendChild(el);
  }

  const board = $("board");
board.innerHTML = "";

for (let g = 1; g <= GROUPS; g++) {
  const list = assigned.filter(x => x.group === g);

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="card-head">
      <strong>GROUP ${String(g).padStart(2,"0")}</strong>
      <span class="badge">${list.length} / ${targetSize(g)} ORANG</span>
    </div>
  `;

  const leader = leaders[g - 1];

  if (leader) {
    const leaderBox = document.createElement("div");
    leaderBox.className = "leader";

    const leaderLabel = document.createElement("span");
    leaderLabel.textContent = "👑 KETUA KELOMPOK";

    const leaderName = document.createElement("strong");
    leaderName.textContent = leader.name;

    leaderBox.appendChild(leaderLabel);
    leaderBox.appendChild(leaderName);

    card.appendChild(leaderBox);
  }

  const people = document.createElement("div");
  people.className = "people";

  list.forEach(x => {
    if (leader && x.id === leader.id) return;

    const p = document.createElement("div");
    p.className = "person";
    p.textContent = x.name;

    people.appendChild(p);
  });

  card.appendChild(people);
  board.appendChild(card);
}
}

function confetti() {
  const box = $("confetti");
  box.innerHTML = "";
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = (40 + Math.random() * 20) + "vw";
    p.style.setProperty("--x", ((Math.random() - .5) * 100) + "vw");
    p.style.animationDelay = (Math.random() * .35) + "s";
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    p.style.background = ["#f5c76a","#8b7cff","#5ee6a8","#ff7b8b","#ffffff"][Math.floor(Math.random()*5)];
    box.appendChild(p);
  }
  setTimeout(() => box.innerHTML = "", 3200);
}

function draw() {
  if (busy || !available.length) return;
  busy = true;
  $("drawBtn").disabled = true;
  $("status").textContent = "DRAWING...";
  $("group").textContent = "???";
  $("hint").textContent = "Menentukan peserta dan kelompok...";
  $("name").classList.add("rolling");

  const start = performance.now();
  const timer = setInterval(() => {
    const temp = available[Math.floor(Math.random() * available.length)];
    $("name").textContent = temp.name;
    if (performance.now() - start >= 1450) {
      clearInterval(timer);

      const idx = Math.floor(Math.random() * available.length);
      const person = available.splice(idx, 1)[0];
      const group = pickGroup();

      counts[group - 1]++;
      assigned.push({...person, group});

      $("name").classList.remove("rolling");
      $("name").classList.add("reveal");
      $("name").textContent = person.name;
      $("group").classList.add("reveal");
      $("group").textContent = `GROUP ${String(group).padStart(2,"0")}`;
      $("status").textContent = "CONGRATULATIONS";
      $("meta").textContent = `Peserta #${person.id} • ${assigned.length} dari ${TOTAL}`;
      $("hint").textContent = `Selamat! ${person.name} masuk ke Group ${String(group).padStart(2,"0")}.`;
      confetti();

      setTimeout(() => {
        $("name").classList.remove("reveal");
        $("group").classList.remove("reveal");
      }, 650);

busy = false;

if (!available.length) {
    chooseLeaders();

    $("saveBtn").disabled = false;

    document.body.classList.add("done");
    $("status").textContent = "DRAW COMPLETE";
    $("hint").textContent = "Semua 68 peserta sudah mendapatkan kelompok.";
}

render();

    }
  }, 85);
}

function saveResult() {
  if (assigned.length !== TOTAL) {
    alert("Undian belum selesai. Selesaikan semua 68 peserta terlebih dahulu.");
    return;
  }

  const rows = [
    ["GROUP", "STATUS", "ID PESERTA", "NAMA PESERTA"]
  ];

  for (let g = 1; g <= GROUPS; g++) {
    const leader = leaders[g - 1];
    const members = assigned.filter(x => x.group === g);

    members.forEach(person => {
      rows.push([
        `GROUP ${String(g).padStart(2, "0")}`,
        leader && person.id === leader.id ? "KETUA" : "ANGGOTA",
        person.id,
        person.name
      ]);
    });
  }

  const csv = rows.map(row =>
    row.map(value =>
      `"${String(value).replace(/"/g, '""')}"`
    ).join(",")
  ).join("\r\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "Hasil_Undian_Group_KGB_2026.csv";

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
}

$("saveBtn").addEventListener("click", saveResult);

$("drawBtn").addEventListener("click", draw);
$("resetBtn").addEventListener("click", () => {
  if (!busy && confirm("Reset semua hasil undian dan mulai dari awal?")) reset();
});
$("fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch(e) {}
});
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    draw();
  }
});
reset();
</script>
</body>
</html>
